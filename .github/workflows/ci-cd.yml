# =============================================================================
# CI/CD Pipeline -- Data Engineer Path
# =============================================================================
#
# Runs lint, test, build, and deploy for the data engineering projects.
#
# Trigger rules:
#   - Push to main: full pipeline (lint + test + build + deploy)
#   - PR to main: lint + test only (no build/deploy)
#   - Manual: workflow_dispatch for on-demand runs
#
# Design decisions:
#   - Matrix strategy with Python 3.12 only (the project target).
#     Easy to expand to 3.11+ later by adding to the matrix.
#   - pip cache speeds up dependency installation (~30s vs ~90s).
#   - Docker build only on main push (PRs just validate code quality).
#   - Deploy requires manual approval via environment protection rules.
#     Set this up in GitHub Settings > Environments > production.
#   - Each project runs tests independently to isolate failures.
#
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloud Run after build?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

# Cancel in-progress runs for the same branch/PR.
# Saves CI minutes when pushing multiple commits quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared environment variables across all jobs.
  PYTHON_VERSION: "3.12"
  GCP_REGION: us-central1
  # Matches the existing internal (IAM-auth) Cloud Run service in GCP.
  # CLAUDE.md registry notes P02 is owner-only; keep the name stable here.
  SERVICE_NAME: dev-claims-elt-pipeline
  # Public Cloud Run service for the P01 Claims Analytics dashboard (FastAPI).
  DASHBOARD_SERVICE_NAME: claims-dashboard

jobs:
  # ===========================================================================
  # Job 0: Detect changed paths
  # ===========================================================================
  # Lets us skip the dashboard build+deploy when the PR/push does not touch
  # the dashboard directory.  Saves ~4 minutes of CI time per unrelated change.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dashboard:
              - 'projects/01-claims-warehouse/dashboard/**'

  # ===========================================================================
  # Job 1: Lint
  # ===========================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Cache pip dependencies based on all pyproject.toml files.
          cache-dependency-path: |
            projects/01-claims-warehouse/pyproject.toml
            projects/02-orchestrated-elt/pyproject.toml
            projects/03-streaming-claims-intake/pyproject.toml
            projects/05-streaming-claims-pipeline/pyproject.toml
            projects/06-pricing-ml-pipeline/pyproject.toml

      - name: Install ruff
        # Pinned deliberately. `ruff>=0.4.0` resolved to whatever was newest at
        # run time, so the lint job's verdict drifted with no change to this
        # repo: 0.16.3 turned on rules the code predates and failed P02 with 10
        # findings in files nobody had touched since the last green run. A
        # linter that can fail a PR because of its own release schedule is not
        # a gate, it is a coin flip. Bump this on purpose, with the findings
        # fixed in the same PR -- which is what raising it to 0.16.4 did.
        run: pip install ruff==0.16.4

      - name: Lint Project 01 (Claims Warehouse)
        run: ruff check projects/01-claims-warehouse/src/

      - name: Lint Project 02 (Orchestrated ELT)
        run: ruff check projects/02-orchestrated-elt/src/ --exclude="*/airflow_dags/*"
        # Exclude Airflow DAGs from lint because they import airflow packages
        # that are not installed in the test environment.  The DAG file is
        # validated separately by parsing it as a Python module.

      - name: Lint Project 03 (Streaming Claims Intake)
        run: ruff check projects/03-streaming-claims-intake/src/

      - name: Lint Project 05 (Streaming Claims Pipeline)
        run: ruff check projects/05-streaming-claims-pipeline/src/

      - name: Lint Project 06 (Pricing ML Pipeline)
        run: ruff check projects/06-pricing-ml-pipeline/src/

      # The dashboard is the only publicly reachable service in the repo and
      # went unlinted until 2026-08-23 -- the lint steps above all target
      # `src/`, and it lives in `dashboard/`.  It picks up P01's ruff config,
      # including the per-file E501 ignore for the vendor-minified PostHog
      # loader.
      - name: Lint Project 01 dashboard (public service)
        run: ruff check projects/01-claims-warehouse/dashboard/

      - name: Check formatting
        run: ruff format --check projects/01-claims-warehouse/src/ projects/02-orchestrated-elt/src/ projects/03-streaming-claims-intake/src/ projects/05-streaming-claims-pipeline/src/ projects/06-pricing-ml-pipeline/src/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform (Project 04)
        run: |
          cd projects/04-data-platform-terraform
          terraform fmt -check -recursive

  # ===========================================================================
  # Job 2: Test
  # ===========================================================================
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            projects/01-claims-warehouse/pyproject.toml
            projects/02-orchestrated-elt/pyproject.toml
            projects/03-streaming-claims-intake/pyproject.toml
            projects/05-streaming-claims-pipeline/pyproject.toml
            projects/06-pricing-ml-pipeline/pyproject.toml

      # -- Project 01: Claims Warehouse --------------------------------------
      - name: Install Project 01 dependencies
        run: |
          cd projects/01-claims-warehouse
          pip install -e ".[dev]"

      - name: Run Project 01 tests
        run: |
          cd projects/01-claims-warehouse
          python -m pytest tests/ -v --tb=short --junitxml=../../test-results/project01.xml

      # -- Project 01 dashboard: the public FastAPI service --------------------
      # Separate from the P01 step above: the dashboard has its own
      # requirements.txt and its own pytest root.  Covers the canonical-host
      # redirect and the same-origin PostHog proxy, neither of which had any
      # test until 2026-08-23.  No network and no GCP calls -- the cache warm is
      # stubbed and the upstream is faked.
      - name: Install Project 01 dashboard dependencies
        run: |
          cd projects/01-claims-warehouse/dashboard
          pip install -r requirements.txt pytest

      - name: Run Project 01 dashboard tests
        run: |
          cd projects/01-claims-warehouse/dashboard
          python -m pytest -v --tb=short --junitxml=../../../test-results/dashboard.xml

      # -- Project 02: Orchestrated ELT ---------------------------------------
      - name: Install Project 02 dependencies
        run: |
          cd projects/02-orchestrated-elt
          pip install -e ".[dev]"

      - name: Run Project 02 tests
        run: |
          cd projects/02-orchestrated-elt
          python -m pytest tests/ -v --tb=short --junitxml=../../test-results/project02.xml

      # -- Project 03: Streaming Claims Intake --------------------------------
      - name: Install Project 03 dependencies
        run: |
          cd projects/03-streaming-claims-intake
          pip install -e ".[dev]"

      - name: Run Project 03 tests
        run: |
          cd projects/03-streaming-claims-intake
          python -m pytest tests/ -v --tb=short --junitxml=../../test-results/project03.xml

      # -- Project 05: Streaming Claims Pipeline --------------------------------
      - name: Install Project 05 dependencies
        run: |
          cd projects/05-streaming-claims-pipeline
          pip install -e ".[dev]"

      - name: Run Project 05 tests
        run: |
          cd projects/05-streaming-claims-pipeline
          python -m pytest tests/ -v --tb=short --junitxml=../../test-results/project05.xml

      # -- Project 06: Pricing ML Pipeline --------------------------------------
      - name: Install Project 06 dependencies
        run: |
          cd projects/06-pricing-ml-pipeline
          pip install -e ".[dev]"

      - name: Run Project 06 tests
        run: |
          cd projects/06-pricing-ml-pipeline
          python -m pytest tests/ -v --tb=short --junitxml=../../test-results/project06.xml

      # -- Validate Airflow DAG syntax ----------------------------------------
      - name: Validate Airflow DAG (syntax check)
        run: |
          # Parse the DAG file as Python to catch syntax errors.
          # We don't import it (Airflow is not installed) but we verify
          # it's valid Python that can be parsed by the interpreter.
          python -c "
          import ast
          with open('projects/02-orchestrated-elt/src/airflow_dags/claims_etl_dag.py') as f:
              ast.parse(f.read())
          print('Airflow DAG syntax: OK')
          "

      # -- Upload test results ------------------------------------------------
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7

  # ===========================================================================
  # Job 3: Build Docker Image
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only build on pushes to main (not on PRs or pushes to dev).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Required so the GCP WIF secrets live in one place (the `production`
    # environment) and both build and deploy read them consistently.
    environment: production

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -- Authenticate to GCP using Workload Identity Federation -------------
      # This is more secure than storing a service account key as a secret.
      # Set up WIF following:
      #   https://github.com/google-github-actions/auth#setup
      #
      # Required GitHub secrets:
      #   GCP_PROJECT_ID: your GCP project ID
      #   GCP_WIF_PROVIDER: projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      #   GCP_WIF_SERVICE_ACCOUNT: <sa-name>@<project-id>.iam.gserviceaccount.com
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- Build the Docker image ---------------------------------------------
      - name: Build Docker image
        run: |
          cd projects/02-orchestrated-elt
          docker build \
            --tag "${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --tag "${{ env.SERVICE_NAME }}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            .

      # -- Push to Artifact Registry (only if GCP auth succeeded) -------------
      - name: Configure Docker for Artifact Registry
        if: steps.auth.outcome == 'success'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # The `data-pipelines` repository was never declared anywhere CI runs.
      # `cloud_run/deploy.sh` creates it, but that script is for manual deploys
      # and the workflow does not call it, so the pipeline silently depended on
      # a one-off bootstrap.  On 2026-08-23 the repository was gone, both image
      # pushes failed with `Repository "data-pipelines" not found`, and both
      # deploy jobs were skipped -- a green-looking merge that shipped nothing.
      # Creating it here is idempotent: `|| true` swallows the ALREADY_EXISTS
      # that every subsequent run returns.
      - name: Ensure the Artifact Registry repository exists
        if: steps.auth.outcome == 'success'
        run: |
          gcloud artifacts repositories create data-pipelines \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Container images for data-engineer-path CI/CD" \
            --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null \
            || echo "Repository data-pipelines already exists."

      - name: Push to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          FULL_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-pipelines/${{ env.SERVICE_NAME }}"
          docker tag "${{ env.SERVICE_NAME }}:${{ github.sha }}" "${FULL_IMAGE}:${{ github.sha }}"
          docker tag "${{ env.SERVICE_NAME }}:latest" "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${{ github.sha }}"
          docker push "${FULL_IMAGE}:latest"

  # ===========================================================================
  # Job 4: Deploy to Cloud Run
  # ===========================================================================
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build]
    # Deploy only on main push AND when manually approved.
    # The 'production' environment should have protection rules in GitHub.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-pipelines/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --memory=1Gi
            --cpu=1
            --timeout=900
            --max-instances=1
            --min-instances=0
            --no-allow-unauthenticated

      # Deliberately NOT the canary flow the dashboard uses.  This service is
      # IAM-gated and internal, so smoke-testing it means minting an identity
      # token for every request -- real complexity to protect a surface no
      # visitor reaches.  What is worth catching is a revision that deploys but
      # never becomes ready, which this does.
      - name: Verify the new revision became ready
        if: steps.deploy.outcome == 'success'
        run: |
          READY=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.latestReadyRevisionName)")
          CREATED=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.latestCreatedRevisionName)")
          echo "created=$CREATED ready=$READY"
          if [ "$READY" != "$CREATED" ]; then
            echo "::error title=Revision not ready::$CREATED was created but $READY is still the newest ready revision"
            exit 1
          fi

      - name: Show deployment URL
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Deployed to: ${{ steps.deploy.outputs.url }}"
          echo "Test health: curl -H 'Authorization: Bearer \$(gcloud auth print-identity-token)' ${{ steps.deploy.outputs.url }}/health"

  # ===========================================================================
  # Job 5: Build Dashboard Image (P01 FastAPI claims-dashboard)
  # ===========================================================================
  # Separate from the ELT build because the dashboard is its own Cloud Run
  # service with a different Dockerfile, public visibility, and independent
  # release cadence.  Path-filtered: only runs when the dashboard dir changes.
  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    needs: [lint, test, changes]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.dashboard == 'true'
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dashboard Docker image
        run: |
          cd projects/01-claims-warehouse/dashboard
          docker build \
            --tag "${{ env.DASHBOARD_SERVICE_NAME }}:${{ github.sha }}" \
            --tag "${{ env.DASHBOARD_SERVICE_NAME }}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            .

      - name: Configure Docker for Artifact Registry
        if: steps.auth.outcome == 'success'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # The `data-pipelines` repository was never declared anywhere CI runs.
      # `cloud_run/deploy.sh` creates it, but that script is for manual deploys
      # and the workflow does not call it, so the pipeline silently depended on
      # a one-off bootstrap.  On 2026-08-23 the repository was gone, both image
      # pushes failed with `Repository "data-pipelines" not found`, and both
      # deploy jobs were skipped -- a green-looking merge that shipped nothing.
      # Creating it here is idempotent: `|| true` swallows the ALREADY_EXISTS
      # that every subsequent run returns.
      - name: Ensure the Artifact Registry repository exists
        if: steps.auth.outcome == 'success'
        run: |
          gcloud artifacts repositories create data-pipelines \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Container images for data-engineer-path CI/CD" \
            --project="${{ secrets.GCP_PROJECT_ID }}" 2>/dev/null \
            || echo "Repository data-pipelines already exists."

      - name: Push Dashboard image to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          FULL_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-pipelines/${{ env.DASHBOARD_SERVICE_NAME }}"
          docker tag "${{ env.DASHBOARD_SERVICE_NAME }}:${{ github.sha }}" "${FULL_IMAGE}:${{ github.sha }}"
          docker tag "${{ env.DASHBOARD_SERVICE_NAME }}:latest" "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${{ github.sha }}"
          docker push "${FULL_IMAGE}:latest"

  # ===========================================================================
  # Job 6: Deploy Dashboard to Cloud Run
  # ===========================================================================
  # Public service: --allow-unauthenticated.  Matches current live resource
  # limits (memory=512Mi, cpu=1, maxScale=2) observed on the running service.
  deploy-dashboard:
    name: Deploy Dashboard to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-dashboard]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      # Ship the revision with NO traffic and a `canary` tag.  Until the smoke
      # test below passes, the previously deployed revision keeps serving every
      # visitor, so a revision that boots but renders BigQuery errors never
      # reaches anyone.  Before this, CI deployed and stopped -- a broken
      # revision would have served the public until the weekly health-check.
      - name: Deploy Dashboard to Cloud Run (no traffic, tagged canary)
        id: deploy
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.DASHBOARD_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/data-pipelines/${{ env.DASHBOARD_SERVICE_NAME }}:${{ github.sha }}
          # Env vars the container requires at startup.  Injected on every
          # deploy so a fresh revision never ships without them; a previous
          # Cloud Run service had no env vars set and the dashboard crashed
          # on bq_client import.  Keep this list as the single source of
          # truth for runtime configuration.
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            CANONICAL_REDIRECT_HOST=data-engineer.gonor.me
          flags: |
            --memory=512Mi
            --cpu=1
            --max-instances=2
            --min-instances=0
            --allow-unauthenticated
            --no-traffic
            --tag=canary

      # `steps.deploy.outputs.url` is the *service* URL, which still points at
      # the old revision while traffic is unmoved.  The canary URL is the only
      # address that reaches the new one.
      - name: Resolve the canary URL
        id: canary
        if: steps.deploy.outcome == 'success'
        run: |
          # Parsed in Python rather than a gcloud --format projection: the
          # filter/extract syntax fails silently to an empty string when the
          # shape changes, and an empty URL would let the smoke test be skipped
          # rather than fail.  Kept on one line -- YAML block scalars preserve
          # relative indentation, and indented input to `python3 -c` is a syntax
          # error.
          URL=$(gcloud run services describe "${{ env.DASHBOARD_SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format=json | python3 -c "import json,sys; t=json.load(sys.stdin).get('status',{}).get('traffic',[]); print(next((x['url'] for x in t if x.get('tag')=='canary' and x.get('url')), ''))")
          if [ -z "$URL" ]; then
            echo "::error title=No canary URL::the tagged revision has no URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Canary: $URL"

      # The app exempts `/health` and any `---` tagged host from the canonical
      # redirect precisely so this can work; without those exemptions the smoke
      # test would be answered by the revision it is meant to replace.
      - name: Smoke-test the canary revision
        id: smoke
        if: steps.canary.outcome == 'success'
        run: |
          URL="${{ steps.canary.outputs.url }}"

          # Retry: a scale-to-zero service cold-starts, and the first BigQuery
          # query on a fresh container is slower than the steady state.
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health" || true)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: /health -> $CODE"
            sleep 6
          done
          if [ "$CODE" != "200" ]; then
            echo "::error title=Canary unhealthy::/health returned $CODE"
            exit 1
          fi

          BODY=$(curl -s --max-time 60 "$URL/")
          # A 200 is not enough: the page renders its shell even when every
          # panel is failing.  On 2026-08-14 it returned 200 while every query
          # reported `Not found: Table dev_claims_analytics.fct_claims`.
          if ! printf '%s' "$BODY" | grep -q "BigQuery Connected"; then
            echo "::error title=Canary has no data::overview did not report BigQuery Connected"
            exit 1
          fi
          if printf '%s' "$BODY" | grep -qE "Could not load KPI|Not found: Table"; then
            echo "::error title=Canary rendering errors::overview reported a query failure"
            exit 1
          fi

          for p in loss-triangle portfolio-health pricing-adequacy geographic-risk how-its-built; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/$p")
            echo "  /$p -> $CODE"
            [ "$CODE" = "200" ] || { echo "::error title=Canary route failed::/$p returned $CODE"; exit 1; }
          done
          echo "Canary passed all checks."

      # Only now does the public start seeing it.
      - name: Promote the canary to 100% traffic
        if: steps.smoke.outcome == 'success'
        run: |
          gcloud run services update-traffic "${{ env.DASHBOARD_SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --to-latest
          echo "Dashboard promoted: ${{ steps.deploy.outputs.url }}"

      # Reached only when the smoke test failed.  Traffic was never moved, so
      # the previous revision is still serving -- this reports that rather than
      # performing a rollback, because there is nothing to roll back.
      - name: Report that traffic was NOT moved
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error title=Deploy halted::the canary failed its smoke test and traffic was left on the previous revision. The site is still up on the old code."
          gcloud run services describe "${{ env.DASHBOARD_SERVICE_NAME }}" \
            --region="${{ env.GCP_REGION }}" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="table(status.traffic)" || true
