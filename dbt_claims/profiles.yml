# Run with:  dbt <cmd> --profiles-dir .   (or export DBT_PROFILES_DIR=.)
# No credentials live in this file. Snowflake values come from the environment.
claims:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: claims.duckdb # relative to where dbt is run; gitignored
      schema: main
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'CLAIMS') }}"
      threads: 4
