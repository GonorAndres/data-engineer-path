# The dashboard needs its own pytest root.
#
# Without it, pytest walks up to projects/01-claims-warehouse/pyproject.toml,
# whose `pythonpath = ["src"]` puts the DuckDB pipeline's src/ on sys.path --
# and that directory also contains a main.py. `import main` then resolves to the
# pipeline instead of the FastAPI app, and every test errors on a missing duckdb.
#
# Deliberately pytest.ini and not pyproject.toml: ruff resolves its config from
# the nearest pyproject.toml, and adding one here would detach the dashboard
# from the project's line-length and rule selection.
[pytest]
testpaths = tests
pythonpath = .
